name: Build CHIKI BONA APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Preserve Flutter project configuration
        run: cp pubspec.yaml /tmp/chiki_bona_pubspec.yaml

      - name: Create Android platform files
        run: flutter create --platforms=android --org com.chikibona --project-name chiki_bona .

      - name: Restore project dependencies
        run: cp /tmp/chiki_bona_pubspec.yaml pubspec.yaml

      - name: Remove default Flutter test
        run: rm -rf test

      - name: Enable HTTP API access for the VPS
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()

          if 'android.permission.INTERNET' not in s:
              s = s.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'
                  '    <uses-permission android:name="android.permission.INTERNET" />'
              )

          if 'android:usesCleartextTraffic=' not in s:
              s = s.replace(
                  '<application ',
                  '<application android:usesCleartextTraffic="true" ',
                  1
              )

          p.write_text(s)
          PY

      - name: Get packages
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CHIKI_BONA_APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
